name: Check domain

# Temporary, read-only: does bible.atlas.jonyen.com resolve and serve the site?
on:
  push:
    branches: [claude/blissful-brown-1xpud0]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in 1.1.1.1 8.8.8.8; do echo "== @$r"; dig +noall +answer @$r bible.atlas.jonyen.com; done
          curl -sS -o /dev/null -D - --max-time 20 https://bible.atlas.jonyen.com | head -12 || true
