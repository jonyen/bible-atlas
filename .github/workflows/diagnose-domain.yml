name: Diagnose domain

# Temporary, read-only: why bible.atlas.jonyen.com isn't reachable.
on:
  push:
    branches: [claude/blissful-brown-1xpud0]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@59.20.0

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          for n in bible.atlas.jonyen.com atlas.jonyen.com jonyen.com; do
            echo "== $n"; dig +noall +answer "$n" A; dig +noall +answer "$n" CNAME; dig +short NS "$n"
          done
      - name: HTTP
        continue-on-error: true
        run: |
          for u in https://bible.atlas.jonyen.com https://atlas.jonyen.com; do
            echo "== $u"; curl -sS -o /dev/null -D - --max-time 20 "$u" | head -15 || true
          done
      - name: Vercel
        continue-on-error: true
        run: |
          t=--token=${{ secrets.VERCEL_TOKEN }}
          npx --yes $VERCEL_CLI whoami $t || true
          echo "== project"; npx --yes $VERCEL_CLI project inspect $t || true
          echo "== domains on account"; npx --yes $VERCEL_CLI domains ls $t || true
          echo "== inspect jonyen.com"; npx --yes $VERCEL_CLI domains inspect jonyen.com $t || true
          echo "== aliases"; npx --yes $VERCEL_CLI alias ls $t | head -30 || true
          echo "== latest prod deployments"; npx --yes $VERCEL_CLI ls --prod $t | head -15 || true
          echo "== project domains API"
          curl -sS -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" \
            | jq '.domains[] | {name, verified, redirect, gitBranch, verification}' || true
          for d in bible.atlas.jonyen.com atlas.jonyen.com; do
            echo "== config $d"
            curl -sS -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v6/domains/$d/config?teamId=$VERCEL_ORG_ID" | jq . || true
          done
